<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Conectar TikTok · KtitiZ News</title>

    <meta
        name="description"
        content="Conecta tu cuenta de TikTok con KtitiZ News.">

    <meta name="theme-color" content="#080018">

    <link rel="icon" type="image/png" href="../favicon.png">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(0, 230, 217, 0.14),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 90% 40%,
                    rgba(122, 0, 255, 0.18),
                    transparent 40%
                ),
                #080018;
        }

        .contenedor {

            width: min(520px, 100%);

            padding: 40px 30px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    rgba(30, 15, 65, 0.98),
                    rgba(10, 5, 30, 0.98)
                );

            border:
                1px solid rgba(0, 230, 217, 0.45);

            border-radius: 22px;

            box-shadow:
                0 0 25px rgba(0, 230, 217, 0.15),
                0 0 45px rgba(122, 0, 255, 0.12);
        }

        .logo {

            width: min(220px, 70vw);

            height: auto;

            display: block;

            margin: 0 auto 25px;

            border-radius: 50%;

            box-shadow:
                0 0 20px rgba(0, 230, 217, 0.5),
                0 0 35px rgba(122, 0, 255, 0.35);
        }

        h1 {

            margin:
                0 0 12px;

            font-size:
                clamp(28px, 7vw, 40px);
        }

        .subtitulo {

            color: #00e6d9;

            font-size: 18px;

            font-weight: bold;

            margin-bottom: 25px;
        }

        p {

            color: #dddddd;

            line-height: 1.6;

            font-size: 16px;

            margin:
                10px 0;
        }

        .boton-tiktok {

            display: inline-block;

            margin-top: 25px;

            padding:
                16px 28px;

            border-radius: 12px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #00e6d9,
                    #7a00ff
                );

            font-size: 18px;

            font-weight: bold;

            text-decoration: none;

            box-shadow:
                0 0 20px rgba(0, 230, 217, 0.25);

            transition:
                transform 0.2s,
                box-shadow 0.2s;
        }

        .boton-tiktok:hover {

            transform:
                scale(1.04);

            box-shadow:
                0 0 25px rgba(0, 230, 217, 0.55);
        }

        .volver {

            display: block;

            margin-top: 25px;

            color: #aaaaaa;

            text-decoration: none;

            font-size: 14px;
        }

        .volver:hover {

            color: #00e6d9;
        }

    </style>

</head>

<body>

    <main class="contenedor">

        <img
            class="logo"
            src="../logo-ktitiz-news-500kb.jpg"
            alt="KtitiZ News">

        <h1>
            Conectar TikTok
        </h1>

        <div class="subtitulo">
            KtitiZ News · Creator
        </div>

        <p>
            Conecta tu cuenta de TikTok con KtitiZ News
            para utilizar las funciones de creación y publicación
            de contenido.
        </p>

        <p>
            Serás redirigido a TikTok para autorizar la conexión
            de tu cuenta.
        </p>

        <a
    class="boton-tiktok"
    href="/api/tiktok/login">
    🎵 Continuar con TikTok
</a>

        <a
            class="volver"
            href="../">
            ← Volver a KtitiZ News
        </a>

    </main>

</body>

</html>
